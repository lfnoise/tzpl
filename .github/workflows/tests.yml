name: tests

on:
  push:
    branches: [ main ]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lang-tests:
    # macOS: the project targets darwin (CoreAudio) and uses [[clang::musttail]],
    # which Apple Clang on the runner supports.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # Only the interpreter is needed to run the lang golden suite.
      - name: Build tzpl
        run: cmake --build build --target tzpl -j$(sysctl -n hw.ncpu)

      # Runs every *.x golden test (existentials included). The runner exits
      # non-zero on any failure; the grep guards against the filter/runner
      # silently matching zero tests (which would otherwise exit 0).
      - name: Run lang tests
        working-directory: lang/tests
        run: |
          bash run_tests.sh | tee result.txt
          grep -Eq '[1-9][0-9]* passed' result.txt

  # Both GUI apps must keep building in parallel (ImGui + JUCE), with the
  # notebook/document tests and the JUCE headless self-test green.
  apps-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (both apps)
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DTZPL_BUILD_APP=ON -DTZPL_BUILD_APP_JUCE=ON

      - name: Build ImGui app + doc tests
        run: cmake --build build --target tzpl_app tzpl_doc_tests -j$(sysctl -n hw.ncpu)

      - name: Build JUCE app
        run: cmake --build build --target tzpl_app_juce -j$(sysctl -n hw.ncpu)

      - name: Doc tests
        run: ./build/app/tzpl_doc_tests

      - name: Build synthdef-compiler
        run: cmake --build build --target synthdef-compiler -j$(sysctl -n hw.ncpu)

      # End-to-end: codegen -> clang -> dylib -> dlopen -> ABI check.
      - name: Synthdef compiler tests
        run: ./build/synthdef-compiler/synthdef-compiler --test

      - name: JUCE headless self-test
        run: |
          BIN=./build/app/tzpl_app_juce_artefacts/Release/Tzopilotl.app/Contents/MacOS/Tzopilotl
          TZPL_JUCE_SELFTEST=1 "$BIN" -I bridge/modules:lang/modules | tee st.txt
          grep -q "SELFTEST OK" st.txt

      # The device-free integration scripts (the ones that drive tzpl_app
      # with --no-audio). Informational for now; promote once proven stable
      # on runners.
      - name: Integration tests (headless)
        continue-on-error: true
        run: |
          for t in run_codegen_validity_test.sh run_fx_compile_test.sh \
                   run_fill_buffer_test.sh run_bitops_d0_test.sh \
                   run_live_plan_test.sh run_synthc_render_ab.sh \
                   run_live_test.sh run_osc_test.sh run_pink_test.sh; do
            echo "=== $t ==="
            bash "integration-tests/$t"
          done

  # Linux core: interpreter, engine, synthdef compiler (including the runtime
  # clang -> .so -> dlopen plugin pipeline), bridge, headless tzpl_app.
  # Informational until it has a green streak on main; then drop
  # continue-on-error and make it required.
  linux-core:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # clang-19: clang 18 lacks __cpp_concepts >= 202002L, which libstdc++
      # requires for C++23 <expected>. g++-14 supplies the libstdc++ with
      # C++23 <print> that clang picks up automatically.
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 lld-19 g++-14 cmake ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev libpulse-dev libsndfile1-dev \
            python3-numpy

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: linux-core-deps-${{ hashFiles('shared/CMakeLists.txt', 'app/CMakeLists.txt') }}

      - name: Configure
        env: { CC: clang-19, CXX: clang++-19 }
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DTZPL_BUILD_APP=ON -DTZPL_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run lang tests
        working-directory: lang/tests
        run: |
          bash run_tests.sh | tee result.txt
          grep -Eq '[1-9][0-9]* passed' result.txt

      - name: Synthdef compiler tests
        run: ./build/synthdef-compiler/synthdef-compiler --test

      - name: Integration tests (headless)
        run: |
          for t in run_codegen_validity_test.sh run_fx_compile_test.sh \
                   run_fill_buffer_test.sh run_bitops_d0_test.sh \
                   run_live_plan_test.sh run_synthc_render_ab.sh \
                   run_live_test.sh run_osc_test.sh run_pink_test.sh; do
            echo "=== $t ==="
            bash "integration-tests/$t"
          done

  # Linux JUCE app: build + headless self-test under xvfb. Informational
  # until it has a green streak on main; then drop continue-on-error.
  app-juce-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 lld-19 g++-14 cmake ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev libpulse-dev libsndfile1-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev libcurl4-openssl-dev xvfb

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: app-juce-linux-deps-${{ hashFiles('shared/CMakeLists.txt', 'app/CMakeLists.txt') }}

      - name: Configure
        env: { CC: clang-19, CXX: clang++-19 }
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTZPL_BUILD_APP_JUCE=ON

      - name: Build JUCE app
        run: cmake --build build --target tzpl_app_juce -j$(nproc)

      - name: JUCE headless self-test (xvfb)
        run: |
          BIN=./build/app/tzpl_app_juce_artefacts/Release/Tzopilotl
          xvfb-run -a env TZPL_JUCE_SELFTEST=1 "$BIN" -I bridge/modules:lang/modules | tee st.txt
          grep -q "SELFTEST OK" st.txt
