name: tests

on:
  push:
    branches: [ main ]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lang-tests:
    # macOS: the project targets darwin (CoreAudio) and uses [[clang::musttail]],
    # which Apple Clang on the runner supports.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # Only the interpreter is needed to run the lang golden suite.
      - name: Build tzpl
        run: cmake --build build --target tzpl -j$(sysctl -n hw.ncpu)

      # Runs every *.x golden test (existentials included). The runner exits
      # non-zero on any failure; the grep guards against the filter/runner
      # silently matching zero tests (which would otherwise exit 0).
      - name: Run lang tests
        working-directory: lang/tests
        run: |
          bash run_tests.sh | tee result.txt
          grep -Eq '[1-9][0-9]* passed' result.txt

  # Both GUI apps must keep building in parallel (ImGui + JUCE), with the
  # notebook/document tests and the JUCE headless self-test green.
  apps-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (both apps)
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DTZPL_BUILD_APP=ON -DTZPL_BUILD_APP_JUCE=ON

      - name: Build ImGui app + doc tests
        run: cmake --build build --target tzpl_app tzpl_doc_tests -j$(sysctl -n hw.ncpu)

      - name: Build JUCE app
        run: cmake --build build --target tzpl_app_juce -j$(sysctl -n hw.ncpu)

      - name: Doc tests
        run: ./build/app/tzpl_doc_tests

      - name: Build synthdef-compiler
        run: cmake --build build --target synthdef-compiler -j$(sysctl -n hw.ncpu)

      # End-to-end: codegen -> clang -> dylib -> dlopen -> ABI check.
      - name: Synthdef compiler tests
        run: ./build/synthdef-compiler/synthdef-compiler --test

      - name: JUCE headless self-test
        run: |
          BIN=./build/app/tzpl_app_juce_artefacts/Release/Tzopilotl.app/Contents/MacOS/Tzopilotl
          TZPL_JUCE_SELFTEST=1 "$BIN" -I bridge/modules:lang/modules | tee st.txt
          grep -q "SELFTEST OK" st.txt

      # The device-free integration scripts (the ones that drive tzpl_app
      # with --no-audio). Informational for now; promote once proven stable
      # on runners.
      - name: Integration tests (headless)
        continue-on-error: true
        run: |
          for t in run_codegen_validity_test.sh run_fx_compile_test.sh \
                   run_fill_buffer_test.sh run_bitops_d0_test.sh \
                   run_live_plan_test.sh run_synthc_render_ab.sh \
                   run_live_test.sh run_osc_test.sh run_pink_test.sh; do
            echo "=== $t ==="
            bash "integration-tests/$t"
          done

  # Linux core: interpreter, engine, synthdef compiler (including the runtime
  # clang -> .so -> dlopen plugin pipeline), bridge, headless tzpl_app.
  # Informational until it has a green streak on main; then drop
  # continue-on-error and make it required.
  linux-core:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # clang-19: clang 18 lacks __cpp_concepts >= 202002L, which libstdc++
      # requires for C++23 <expected>. g++-14 supplies the libstdc++ with
      # C++23 <print> that clang picks up automatically.
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 lld-19 g++-14 cmake ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev libpulse-dev libsndfile1-dev \
            python3-numpy

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: linux-core-deps-${{ hashFiles('shared/CMakeLists.txt', 'app/CMakeLists.txt') }}

      - name: Configure
        env: { CC: clang-19, CXX: clang++-19 }
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DTZPL_BUILD_APP=ON -DTZPL_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run lang tests
        working-directory: lang/tests
        run: |
          bash run_tests.sh | tee result.txt
          grep -Eq '[1-9][0-9]* passed' result.txt

      - name: Synthdef compiler tests
        run: ./build/synthdef-compiler/synthdef-compiler --test

      - name: Integration tests (headless)
        run: |
          for t in run_codegen_validity_test.sh run_fx_compile_test.sh \
                   run_fill_buffer_test.sh run_bitops_d0_test.sh \
                   run_live_plan_test.sh run_synthc_render_ab.sh \
                   run_live_test.sh run_osc_test.sh run_pink_test.sh; do
            echo "=== $t ==="
            bash "integration-tests/$t"
          done

  # Linux JUCE app: build + headless self-test under xvfb. Informational
  # until it has a green streak on main; then drop continue-on-error.
  app-juce-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 lld-19 g++-14 cmake ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev libpulse-dev libsndfile1-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev libcurl4-openssl-dev xvfb

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: app-juce-linux-deps-${{ hashFiles('shared/CMakeLists.txt', 'app/CMakeLists.txt') }}

      - name: Configure
        env: { CC: clang-19, CXX: clang++-19 }
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTZPL_BUILD_APP_JUCE=ON

      - name: Build JUCE app
        run: cmake --build build --target tzpl_app_juce -j$(nproc)

      - name: JUCE headless self-test (xvfb)
        run: |
          BIN=./build/app/tzpl_app_juce_artefacts/Release/Tzopilotl
          xvfb-run -a env TZPL_JUCE_SELFTEST=1 "$BIN" -I bridge/modules:lang/modules | tee st.txt
          grep -q "SELFTEST OK" st.txt

  # Windows core + JUCE app. Host: clang-cl (preinstalled LLVM) with the VS
  # 2022 Build Tools on the runner; runtime plugins: a pinned llvm-mingw
  # (see docs/WINDOWS.md). Informational until it has a green streak on
  # main; then drop continue-on-error and make it required.
  windows-core:
    runs-on: windows-latest
    continue-on-error: true
    env:
      LLVM_MINGW: llvm-mingw-20260826-ucrt-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Cache llvm-mingw
        id: cache-mingw
        uses: actions/cache@v4
        with:
          path: C:\${{ env.LLVM_MINGW }}
          key: ${{ env.LLVM_MINGW }}

      - name: Fetch llvm-mingw (plugin toolchain)
        if: steps.cache-mingw.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/$env:LLVM_MINGW.zip" -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath C:\

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: windows-core-deps-${{ hashFiles('shared/CMakeLists.txt', 'app/CMakeLists.txt', 'engine/CMakeLists.txt') }}

      - name: Configure
        shell: pwsh
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          -DTZPL_PLUGIN_TOOLCHAIN_DIR=C:\$env:LLVM_MINGW
          -DTZPL_BUILD_APP_JUCE=ON -DTZPL_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build

      # Host (clang-cl) and plugin (llvm-mingw) builds must agree on every
      # struct in the plugin ABI.
      - name: ABI layout check
        shell: pwsh
        run: |
          clang-cl /nologo /Ishared shared\tzpl_abi_layout_check.c /Fe:abi_host.exe
          & "C:\$env:LLVM_MINGW\bin\clang.exe" -Ishared shared\tzpl_abi_layout_check.c -o abi_plugin.exe
          .\abi_host.exe > abi_host.txt
          .\abi_plugin.exe > abi_plugin.txt
          Get-Content abi_host.txt
          # "info:" rows (long double etc.) may differ; every struct row must not.
          $h = Get-Content abi_host.txt | Where-Object { $_ -notmatch '^info:' }
          $p = Get-Content abi_plugin.txt | Where-Object { $_ -notmatch '^info:' }
          $d = Compare-Object $h $p
          if ($d) { $d | Format-Table -AutoSize | Out-String | Write-Host; throw "ABI layout differs between clang-cl and llvm-mingw" }

      # Launch diagnostics: the interpreter run directly from PowerShell and
      # from Git Bash (with and without coreutils `timeout`, which the test
      # runner uses), plus its DLL imports, so a startup failure shows its
      # real cause instead of 475 identical golden failures.
      - name: Smoke-run tzpl.exe (pwsh)
        shell: pwsh
        run: |
          llvm-objdump -p build\lang\tzpl.exe | Select-String "DLL Name"
          .\build\lang\tzpl.exe lang\tests\arithmetic\int_basic.x
          "exit code: $LASTEXITCODE"
      - name: Smoke-run tzpl.exe (bash)
        shell: bash
        run: |
          ./build/lang/tzpl.exe lang/tests/arithmetic/int_basic.x; echo "direct exit: $?"
          command -v timeout && timeout 10s ./build/lang/tzpl.exe lang/tests/arithmetic/int_basic.x; echo "timeout exit: $?"
          cd lang/tests && TZPL_BIN=../../build/lang/tzpl.exe bash run_tests.sh --verbose --stop-on-fail --filter arithmetic/int_basic || true

      - name: Run lang tests
        shell: bash
        working-directory: lang/tests
        run: |
          TZPL_BIN=../../build/lang/tzpl.exe bash run_tests.sh | tee result.txt
          grep -Eq '[1-9][0-9]* passed' result.txt

      # End-to-end: codegen -> llvm-mingw -> .dll -> LoadLibrary -> offline render.
      - name: Synthdef compiler tests
        shell: pwsh
        run: .\build\synthdef-compiler\synthdef-compiler.exe --test

      - name: Doc and config tests
        shell: pwsh
        run: |
          .\build\app\tzpl_doc_tests.exe
          .\build\app\tzpl_config_tests.exe

      - name: JUCE headless self-test
        shell: pwsh
        run: |
          $env:TZPL_JUCE_SELFTEST = "1"
          .\build\app\tzpl_app_juce_artefacts\Release\Tzopilotl.exe -I "bridge/modules;lang/modules" | Tee-Object st.txt
          if (-not (Select-String -Path st.txt -Pattern "SELFTEST OK" -Quiet)) { throw "self-test failed" }
